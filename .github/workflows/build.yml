name: Build

# Every push to main is tested, linted, built as a perf APK and attached to a rolling
# "latest" prerelease. Pull requests get everything except the release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two quick pushes cannot race each other to the "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 21, not 17: the screenshot tests run Android 16 under Robolectric, which needs it.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The perf build type is signed with the debug key. A runner has no keystore, so Gradle
      # would generate a fresh one every run and each APK would refuse to install over the last.
      # Put your own ~/.android/debug.keystore in the NULIS_DEBUG_KEYSTORE_BASE64 secret
      # (`base64 -w0 ~/.android/debug.keystore`) and every CI build installs over every other one,
      # and over the builds you make at your desk.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.NULIS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "SIGNED_WITH=the repository's debug key" >> "$GITHUB_ENV"
          else
            echo "::notice::No NULIS_DEBUG_KEYSTORE_BASE64 secret. Gradle will generate a throwaway debug key, so this APK will not install over any other build."
            echo "SIGNED_WITH=a throwaway debug key generated for this run" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testPerfUnitTest

      # Drives the real launcher through every screen on the JVM. No images are written unless
      # asked for (`recordRoborazziDebug`), but a screen that crashes fails here.
      - name: Screenshot tours
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.nulis.launcher.screenshots.*'

      - name: Lint
        run: ./gradlew --no-daemon lintPerf

      - name: Build the perf APK
        run: ./gradlew --no-daemon assemblePerf

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          name="nulis-${version}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/perf/app-perf.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$name"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-perf.html
          if-no-files-found: ignore

      # The rolling "latest" release always points at the newest commit on main, so the tag is
      # deleted and recreated rather than left behind on an older commit.
      - name: Rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built from [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Version ${{ steps.apk.outputs.version }}, \`perf\` build type: release-optimised (R8, not debuggable), signed with ${SIGNED_WITH}."
            echo
            echo "**This is a development build, not a release.** It is rebuilt on every push to \`main\` and replaced in place, so what is attached here changes without warning."
            echo
            echo "---"
            echo
            git log -1 --pretty='### %s%n%n%b'
          } > release-notes.md

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Latest build from main" \
            --notes-file release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            "${{ steps.apk.outputs.name }}"
